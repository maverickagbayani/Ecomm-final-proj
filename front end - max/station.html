<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Station · WattSpot</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="common.js" defer></script>
    <script src="station.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="logo"><a href="index.html">WattSpot</a></div>
      <nav class="topbar-links">
        <a href="map.html">Map</a>
        <a href="directory.html">Stations</a>
        <a href="/shop/cart.html">Cart</a>
      </nav>
    </header>

    <main class="page" id="page">
      <p class="state state-loading">Loading station…</p>
    </main>

    <!-- Report Issue Modal -->
    <div id="report-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="report-title">
      <form id="report-form" class="glass-card" novalidate>
        <h2 id="report-title">Report a problem</h2>
        <p class="muted" id="report-station"></p>
        <label for="issue-type">What's wrong?</label>
        <select id="issue-type" style="width: 100%; margin-bottom: 16px;">
          <option>Broken charger</option>
          <option>Socket blocked</option>
          <option>Payment problem</option>
          <option>Station closed</option>
          <option>Other</option>
        </select>
        <label for="issue-desc">Details (at least 10 characters)</label>
        <textarea id="issue-desc" maxlength="500" placeholder="e.g. CCS2 #1 screen is blank and won't start."></textarea>
        <label for="issue-name">Your name (optional)</label>
        <input id="issue-name" type="text" autocomplete="name" />
        <label for="issue-email">Email (optional)</label>
        <input id="issue-email" type="email" autocomplete="email" />
        <div id="report-msg" role="alert"></div>
        <button id="report-send" type="submit" class="primary-btn">Send report</button>
        <button type="button" class="close-modal primary-btn link-btn">Close</button>
      </form>
    </div>
  </body>
</html>
