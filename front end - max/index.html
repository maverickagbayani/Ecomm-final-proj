<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WattSpot — Welcome</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="auth.js" defer></script>
  </head>
  <body>
    <main class="welcome-container">
      <div class="hero-text">
        <h1>Real-time charging map for your seamless journey.</h1>
        <p>Live socket availability, queue times and battery status across Quezon City.</p>
      </div>

      <div class="glass-card">
        <h2>Create your account</h2>
        
        <p id="status-line" class="muted"></p> 

        <label for="email-box">Email</label>
        <input id="email-box" type="email" placeholder="you@email.com" />

        <label for="password-box">Password</label>
        <input id="password-box" type="password" placeholder="••••••••" />

        <button id="signup-btn" class="primary-btn">Sign up</button>
      </div>
    </main>
  </body>
</html>
