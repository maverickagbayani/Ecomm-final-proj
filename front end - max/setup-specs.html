<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>WattSpot — Confirm your specs</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="setup-specs.js" defer></script>
  </head>
  <body style="display: flex; flex-direction: column; align-items: center; padding-top: 50px;">
    
    <div class="glass-card" style="width: 500px; max-width: 90%;">
      <p class="muted">STEP 2 OF 2</p>
      <h1 id="car-title">Confirm your specs</h1>
      <p class="muted">(placeholders here only)</p>
      
      <label for="battery-box">Battery capacity (kWh)</label>
      <input id="battery-box" type="number" />
      
      <label for="speed-box">Max charging speed (kW)</label>
      <input id="speed-box" type="number" />
      
      <button id="finish-btn" class="primary-btn">Save & start charging</button>
    </div>

  </body>
</html>
