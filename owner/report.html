<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Report an issue · WattSpot</title>
<link rel="stylesheet" href="/app/styles.css">
</head>
<body>
<header id="nav" class="topbar"></header>
<main class="page narrow">
  <h1>Report an issue</h1>
  <p class="page-sub">Tell the station owner about a broken charger or a maintenance problem.</p>
  <form id="f" class="glass-card panel" novalidate>
    <label for="station">Station and plug</label>
    <select id="station" style="width: 100%; margin-bottom: 16px;" disabled><option>Loading stations…</option></select>
    <label for="type">Issue type</label>
    <select id="type" style="width: 100%; margin-bottom: 16px;">
      <option>Broken charger</option>
      <option>Socket blocked</option>
      <option>Payment problem</option>
      <option>Station closed</option>
      <option>Other</option>
    </select>
    <label for="desc">What happened? (10 to 500 characters)</label>
    <textarea id="desc" maxlength="500"></textarea>
    <label for="name">Your name (optional)</label>
    <input id="name" type="text" autocomplete="name">
    <label for="email">Your email (optional)</label>
    <input id="email" type="email" autocomplete="email">
    <div id="message" role="alert" hidden></div>
    <button type="submit" id="send" class="primary-btn">Send report</button>
  </form>
</main>
<script src="app.js"></script>
<script src="report.js"></script>
</body>
</html>
