<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WattSpot — Map</title>

    <!-- Mapbox map library -->
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css"
      rel="stylesheet"
    />

    <!-- Same look as every other page, then the map-only styles -->
    <link rel="stylesheet" href="/app/styles.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="/app/favicon.svg" type="image/svg+xml" />
  </head>

  <body>
    <!-- ===== NAV (same top bar as the other pages) ===== -->
    <header class="topbar">
      <div class="logo"><a href="/app/index.html">WattSpot</a></div>
      <nav class="topbar-links">
        <a href="/frontend-map/index.html" aria-current="page">Map</a>
        <a href="/app/directory.html">Stations</a>
        <a href="/shop/cart.html">Cart</a>
        <!-- Filled from the car saved on the setup pages (script.js) -->
        <a id="car-pill" href="/app/setup-model.html">🚗 Add your car</a>
      </nav>
    </header>

    <!-- ===== MAIN ===== -->
    <main class="layout">
      <!-- LEFT: search, filter chips, map -->
      <section class="left">
        <div class="toolbar">
          <label class="search">
            <span>🔍</span>
            <input id="search" type="text" placeholder="EDSA, Katipunan, Eastwood…" />
          </label>

          <div class="chips" id="chips">
            <button class="pill on" data-group="all">All</button>
            <button class="pill" data-group="connector" data-value="CCS2">CCS2 DC</button>
            <button class="pill" data-group="connector" data-value="Type2">Type 2 AC</button>
            <button class="pill" data-group="pricing" data-value="FREE">Free</button>
            <button class="pill" data-group="pricing" data-value="PAID">Paid</button>
          </div>
        </div>

        <div class="map-wrap">
          <div id="map"></div>

          <!-- Shown if the Mapbox token is missing -->
          <div id="notice" class="notice" hidden></div>

          <!-- Bottom sheet: opens when a pin or a card is tapped -->
          <aside id="sheet" class="sheet" hidden></aside>
        </div>
      </section>

      <!-- RIGHT: nearby hubs list -->
      <aside class="right">
        <h2>Nearby hubs</h2>
        <div id="list" class="list"></div>
      </aside>
    </main>

    <script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
    <!-- config.js is generated by server.js from MAPBOX_TOKEN in .env -->
    <script src="config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
