<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>WattSpot — Desktop Frames (1440×900)</title>

    <style>
      /* ============================================================
         BASE
         ============================================================ */
      :root {
        --ink: #12131f;
        --mut: #7b7f93;
        --bl: #4a6886;
        --bl2: #e6e6ff;
        --gl: rgba(255, 255, 255, 0.6);
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }

      body {
        background: #1c1c1f;
        font-family: Inter, "SF Pro Display", system-ui, sans-serif;
        color: var(--ink);
        padding: 24px 0;
      }

      .lab {
        color: #bbb;
        font: 600 13px Inter, system-ui, sans-serif;
        margin: 28px auto 8px;
        width: var(--w);
      }

      .wrap {
        margin: 0 auto;
        width: var(--w);
        height: var(--h);
        overflow: hidden;
        border-radius: 10px;
      }

      .fr {
        width: 1440px;
        height: 900px;
        transform: scale(var(--s));
        transform-origin: 0 0;
        position: relative;
        overflow: hidden;
        background:
          radial-gradient(900px 500px at 85% 0, #d9d6f7, transparent),
          radial-gradient(700px 500px at 0 100%, #e9dfe9, transparent),
          linear-gradient(160deg, #eef0f5, #e3e5ee);
      }

      /* ============================================================
         NAV
         ============================================================ */
      .nav {
        display: flex;
        align-items: center;
        gap: 40px;
        padding: 28px 72px;
      }

      .logo {
        display: flex;
        gap: 10px;
        align-items: center;
        font-weight: 700;
        font-size: 20px;
      }

      .nav a {
        color: var(--mut);
        font-size: 15px;
        text-decoration: none;
      }

      .nav a.on {
        color: var(--ink);
        font-weight: 600;
      }

      .nav .sp {
        flex: 1;
      }

      /* ============================================================
         ICONS
         ============================================================ */
      .i {
        width: 20px;
        height: 20px;
      }

      .ic {
        display: inline-grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background: var(--bl2);
        color: var(--bl);
        flex: none;
      }

      .ic.s {
        width: 34px;
        height: 34px;
        border-radius: 11px;
      }

      .ic.s .i {
        width: 16px;
        height: 16px;
      }

      /* ============================================================
         CARDS / TYPE / BUTTONS
         ============================================================ */
      .g {
        background: var(--gl);
        backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 32px;
        box-shadow: 0 24px 60px rgba(90, 90, 160, 0.12);
        padding: 32px;
      }

      .dk {
        background: linear-gradient(160deg, #1a1c2b, #0e0f18);
        color: #fff;
        border-radius: 28px;
        padding: 28px;
      }

      .h1 {
        font-size: 56px;
        line-height: 1.05;
        letter-spacing: -2px;
        font-weight: 600;
      }

      .h2 {
        font-size: 38px;
        letter-spacing: -1px;
        font-weight: 600;
      }

      .h3 {
        font-size: 20px;
        font-weight: 600;
      }

      .m {
        color: var(--mut);
        font-size: 15px;
        line-height: 1.55;
      }

      .dk .m {
        color: #a6a9c2;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: var(--bl);
        color: #fff;
        border-radius: 999px;
        padding: 16px 30px;
        font-weight: 600;
        font-size: 15px;
        box-shadow: 0 10px 24px rgba(74, 104, 134, 0.35);
      }

      .btn.o {
        background: #fff;
        color: var(--ink);
        box-shadow: none;
        border: 1px solid #e2e3ee;
      }

      .btn.w {
        width: 100%;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 11px 20px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid #fff;
        font-size: 14px;
        font-weight: 500;
      }

      .pill.on {
        background: var(--bl);
        color: #fff;
      }

      .in {
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid #e6e7f1;
        border-radius: 18px;
        padding: 18px 22px;
        font-size: 15px;
        color: var(--mut);
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .lbl {
        font-size: 13px;
        font-weight: 600;
        margin: 18px 0 8px;
      }

      /* ============================================================
         LAYOUT HELPERS
         ============================================================ */
      .row {
        display: flex;
        gap: 20px;
        align-items: center;
      }

      .col {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .sb {
        justify-content: space-between;
      }

      .main {
        padding: 8px 72px 0;
        display: flex;
        gap: 28px;
        height: 760px;
      }

      /* ============================================================
         TAGS / MAP / PINS
         ============================================================ */
      .tag {
        font-size: 12px;
        font-weight: 600;
        padding: 6px 12px;
        border-radius: 999px;
        background: var(--bl2);
        color: var(--bl);
      }

      .tag.gr {
        background: #dff5ea;
        color: #12804f;
      }

      .tag.or {
        background: #fdebd5;
        color: #b05f00;
      }

      .map {
        position: relative;
        border-radius: 32px;
        overflow: hidden;
        background: linear-gradient(#f4f5fa, #e4e6f1);
        border: 1px solid #fff;
        flex: 1;
      }

      .map:before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          repeating-linear-gradient(
            0deg,
            transparent 0 70px,
            rgba(150, 155, 190, 0.22) 70px 72px
          ),
          repeating-linear-gradient(
            90deg,
            transparent 0 90px,
            rgba(150, 155, 190, 0.22) 90px 92px
          );
        transform: skew(-8deg);
      }

      .pin {
        position: absolute;
        background: var(--bl);
        color: #fff;
        border-radius: 999px;
        padding: 9px 15px;
        font-weight: 600;
        font-size: 14px;
        box-shadow: 0 10px 24px rgba(74, 104, 134, 0.4);
        display: flex;
        gap: 6px;
        align-items: center;
      }

      .pin.d {
        background: #14161f;
      }

      /* ============================================================
         PROGRESS BAR / MODAL / OPTIONS
         ============================================================ */
      .bar {
        height: 10px;
        border-radius: 9px;
        background: #e4e5f0;
        overflow: hidden;
      }

      .bar i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, #8d8df7, var(--bl));
        border-radius: 9px;
      }

      .modal {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 600px;
        z-index: 2;
      }

      .ov {
        position: absolute;
        inset: 0;
        background: rgba(30, 30, 60, 0.25);
        backdrop-filter: blur(8px);
        z-index: 1;
      }

      .sel {
        border: 2px solid var(--bl);
        background: #fff;
      }

      .opt {
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 18px 22px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.75);
        border: 2px solid transparent;
        font-weight: 500;
      }

      hr {
        border: 0;
        border-top: 1px solid #e3e4ee;
        margin: 18px 0;
      }

      .ctr {
        display: grid;
        place-items: center;
      }

      .car {
        width: 100%;
        height: 220px;
        border-radius: 26px;
        background: linear-gradient(135deg, #e2e1fb, #f4f0f7);
        display: grid;
        place-items: center;
        color: var(--bl);
      }

      /* ============================================================
         v1 — GLOSSY BACKGROUND + DECORATIVE SHAPES
         ============================================================ */
      .fr {
        background:
          radial-gradient(650px 480px at 92% 6%, rgba(150, 140, 255, 0.6), transparent 70%),
          radial-gradient(560px 460px at 4% 96%, rgba(255, 185, 205, 0.55), transparent 70%),
          radial-gradient(520px 420px at 62% 108%, rgba(120, 185, 255, 0.5), transparent 70%),
          radial-gradient(420px 320px at 28% -2%, rgba(255, 215, 185, 0.5), transparent 70%),
          linear-gradient(160deg, #f3f3fa, #dde1ee);
      }

      .fr > .nav,
      .fr > .main {
        position: relative;
        z-index: 1;
      }

      .deco {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }

      .deco i {
        position: absolute;
        display: block;
      }

      .deco .sp {
        width: 190px;
        height: 190px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 30% 24%,
          #fff 0,
          rgba(255, 255, 255, 0.75) 14%,
          rgba(175, 175, 255, 0.55) 45%,
          rgba(74, 104, 134, 0.75) 100%
        );
        box-shadow:
          inset -14px -18px 40px rgba(60, 60, 200, 0.45),
          inset 10px 10px 30px rgba(255, 255, 255, 0.9),
          0 40px 70px rgba(74, 104, 134, 0.3);
      }

      .deco .tl {
        width: 150px;
        height: 150px;
        border-radius: 38px;
        transform: rotate(-18deg);
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.85),
          rgba(190, 190, 255, 0.25) 55%,
          rgba(255, 255, 255, 0.55)
        );
        border: 1.5px solid rgba(255, 255, 255, 0.95);
        box-shadow:
          inset 0 2px 0 #fff,
          inset 0 -14px 30px rgba(74, 104, 134, 0.25),
          0 30px 60px rgba(74, 104, 134, 0.25);
        backdrop-filter: blur(6px);
      }

      .deco .pl {
        width: 230px;
        height: 76px;
        border-radius: 999px;
        transform: rotate(14deg);
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.9),
          rgba(200, 205, 255, 0.3)
        );
        border: 1.5px solid #fff;
        box-shadow:
          inset 0 2px 0 #fff,
          0 26px 50px rgba(74, 104, 134, 0.22);
      }

      .g {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.78),
          rgba(255, 255, 255, 0.28)
        );
        -webkit-backdrop-filter: blur(40px) saturate(190%);
        backdrop-filter: blur(40px) saturate(190%);
        border: 1px solid rgba(255, 255, 255, 0.85);
        box-shadow:
          0 34px 80px rgba(80, 80, 180, 0.2),
          inset 0 1.5px 0 #fff,
          inset 0 -1px 0 rgba(255, 255, 255, 0.4),
          inset 0 0 40px rgba(255, 255, 255, 0.25);
      }

      .dk {
        background:
          radial-gradient(420px 220px at 100% 0, rgba(130, 130, 255, 0.5), transparent 70%),
          linear-gradient(145deg, rgba(46, 50, 92, 0.94), rgba(12, 13, 26, 0.96));
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow:
          0 34px 80px rgba(40, 40, 140, 0.4),
          inset 0 1.5px 0 rgba(255, 255, 255, 0.3),
          inset 0 0 50px rgba(120, 120, 255, 0.12);
      }

      .ic {
        background: linear-gradient(145deg, #fff, #d9d9ff);
        box-shadow:
          inset 0 1.5px 0 #fff,
          inset 0 -6px 12px rgba(74, 104, 134, 0.18),
          0 10px 22px rgba(74, 104, 134, 0.22);
        border: 1px solid rgba(255, 255, 255, 0.9);
      }

      .dk .ic {
        background: linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.3),
          rgba(255, 255, 255, 0.08)
        );
        border-color: rgba(255, 255, 255, 0.3);
        color: #b9b9ff;
      }

      .btn {
        background: linear-gradient(180deg, #8f8fff, #4a6886 55%, #4a4ae0);
        box-shadow:
          inset 0 1.5px 0 rgba(255, 255, 255, 0.65),
          inset 0 -6px 12px rgba(40, 40, 190, 0.4),
          0 16px 34px rgba(74, 104, 134, 0.45);
      }

      .btn.o {
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.9),
          rgba(255, 255, 255, 0.5)
        );
        box-shadow:
          inset 0 1.5px 0 #fff,
          0 10px 24px rgba(80, 80, 160, 0.12);
        border: 1px solid #fff;
      }

      .pill {
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.8),
          rgba(255, 255, 255, 0.4)
        );
        -webkit-backdrop-filter: blur(20px);
        backdrop-filter: blur(20px);
        box-shadow:
          inset 0 1.5px 0 #fff,
          0 8px 20px rgba(80, 80, 160, 0.1);
      }

      .pill.on {
        background: linear-gradient(180deg, #8f8fff, #4a6886);
        color: #fff;
        box-shadow:
          inset 0 1.5px 0 rgba(255, 255, 255, 0.6),
          0 10px 24px rgba(74, 104, 134, 0.4);
      }

      .in,
      .opt {
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.45),
          rgba(255, 255, 255, 0.7)
        );
        -webkit-backdrop-filter: blur(16px);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.9);
        box-shadow:
          inset 0 2px 6px rgba(80, 80, 160, 0.08),
          0 1px 0 #fff;
      }

      .opt.sel {
        border: 1.5px solid var(--bl);
        box-shadow:
          0 0 0 5px rgba(74, 104, 134, 0.12),
          inset 0 1.5px 0 #fff;
      }

      .tag {
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.8),
          rgba(215, 215, 255, 0.6)
        );
        box-shadow: inset 0 1px 0 #fff;
      }

      .map {
        background:
          radial-gradient(400px 300px at 30% 30%, rgba(255, 255, 255, 0.7), transparent),
          linear-gradient(145deg, rgba(255, 255, 255, 0.65), rgba(200, 205, 240, 0.45));
        -webkit-backdrop-filter: blur(30px);
        backdrop-filter: blur(30px);
        border: 1px solid rgba(255, 255, 255, 0.9);
        box-shadow:
          0 34px 80px rgba(80, 80, 180, 0.18),
          inset 0 1.5px 0 #fff;
      }

      .pin {
        background: linear-gradient(180deg, #9a9aff, #4a6886);
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow:
          inset 0 1.5px 0 rgba(255, 255, 255, 0.6),
          0 0 0 8px rgba(74, 104, 134, 0.14),
          0 14px 30px rgba(74, 104, 134, 0.5);
      }

      .pin.d {
        background: linear-gradient(180deg, #3a3d5e, #12131f);
      }

      .bar {
        box-shadow: inset 0 2px 4px rgba(80, 80, 160, 0.15);
      }

      .bar i {
        box-shadow: 0 0 14px rgba(74, 104, 134, 0.6);
      }

      .car {
        background:
          radial-gradient(260px 160px at 30% 20%, rgba(255, 255, 255, 0.95), transparent),
          linear-gradient(135deg, rgba(190, 190, 255, 0.7), rgba(255, 230, 240, 0.6));
        border: 1px solid #fff;
        box-shadow:
          inset 0 2px 0 #fff,
          inset 0 -20px 40px rgba(74, 104, 134, 0.12);
      }

      .ov {
        background: rgba(40, 40, 90, 0.22);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
      }

      .modal {
        box-shadow:
          0 50px 120px rgba(50, 50, 160, 0.35),
          inset 0 1.5px 0 #fff;
      }

      /* ============================================================
         v3 — QUIETER BACKGROUND, GLASS ON INTERACTIVE PARTS
         ============================================================ */
      .fr {
        background:
          radial-gradient(620px 440px at 94% 4%, rgba(170, 165, 235, 0.26), transparent 70%),
          radial-gradient(520px 420px at 2% 100%, rgba(235, 205, 215, 0.22), transparent 70%),
          linear-gradient(160deg, #eff0f5, #e1e3eb);
      }

      .deco {
        opacity: 0.5;
        filter: saturate(0.55);
      }

      .g {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.62),
          rgba(255, 255, 255, 0.3)
        );
        box-shadow:
          0 24px 60px rgba(37, 55, 69, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }

      .dk {
        background: linear-gradient(145deg, #2a2c3c, #15161f);
        box-shadow:
          0 24px 60px rgba(30, 30, 60, 0.25),
          inset 0 1px 0 rgba(255, 255, 255, 0.2);
      }

      .ic {
        background:
          radial-gradient(circle at 28% 18%, rgba(255, 255, 255, 0.98), rgba(255, 255, 255, 0.25) 58%),
          linear-gradient(145deg, rgba(150, 150, 255, 0.45), rgba(74, 104, 134, 0.18));
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        border: 1.5px solid rgba(255, 255, 255, 0.95);
        box-shadow:
          inset 0 2px 1px #fff,
          inset 0 -8px 14px rgba(74, 104, 134, 0.22),
          0 12px 26px rgba(74, 104, 134, 0.28);
      }

      .ic .i {
        filter: drop-shadow(0 2px 4px rgba(74, 104, 134, 0.45));
      }

      .dk .ic {
        background:
          radial-gradient(circle at 28% 18%, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.05) 60%),
          rgba(130, 130, 255, 0.22);
        border-color: rgba(255, 255, 255, 0.4);
        color: #aebfcc;
      }

      .btn {
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.5) 0, rgba(255, 255, 255, 0.08) 48%, transparent 50%),
          linear-gradient(180deg, rgba(140, 140, 255, 0.92), rgba(70, 70, 230, 0.95));
        border: 1.5px solid rgba(255, 255, 255, 0.7);
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
        box-shadow:
          inset 0 2px 1px rgba(255, 255, 255, 0.75),
          inset 0 -8px 14px rgba(30, 30, 180, 0.35),
          0 18px 36px rgba(74, 104, 134, 0.4);
      }

      .btn.o {
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.95),
          rgba(255, 255, 255, 0.4)
        );
        border: 1.5px solid #fff;
        color: var(--ink);
        box-shadow:
          inset 0 2px 1px #fff,
          inset 0 -8px 14px rgba(37, 55, 69, 0.12),
          0 12px 28px rgba(37, 55, 69, 0.14);
      }

      .pill {
        background:
          radial-gradient(120px 40px at 30% 0, rgba(255, 255, 255, 0.95), transparent),
          rgba(255, 255, 255, 0.4);
        border: 1.5px solid rgba(255, 255, 255, 0.95);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        backdrop-filter: blur(24px) saturate(180%);
        box-shadow:
          inset 0 2px 1px #fff,
          inset 0 -6px 10px rgba(37, 55, 69, 0.1),
          0 10px 24px rgba(37, 55, 69, 0.14);
      }

      .pill.on {
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.5) 0, rgba(255, 255, 255, 0.08) 48%, transparent 50%),
          linear-gradient(180deg, rgba(140, 140, 255, 0.92), rgba(70, 70, 230, 0.95));
        color: #fff;
        border-color: rgba(255, 255, 255, 0.7);
        box-shadow:
          inset 0 2px 1px rgba(255, 255, 255, 0.7),
          0 12px 26px rgba(74, 104, 134, 0.4);
      }

      .in,
      .opt {
        background:
          radial-gradient(300px 50px at 20% 0, rgba(255, 255, 255, 0.95), transparent),
          rgba(255, 255, 255, 0.35);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        backdrop-filter: blur(24px) saturate(180%);
        border: 1.5px solid rgba(255, 255, 255, 0.95);
        box-shadow:
          inset 0 2px 1px #fff,
          inset 0 -8px 14px rgba(37, 55, 69, 0.1),
          0 12px 28px rgba(37, 55, 69, 0.12);
      }

      .in {
        border-radius: 999px;
      }

      .in[style*="height"] {
        border-radius: 22px;
      }

      .opt.sel {
        border-color: rgba(74, 104, 134, 0.8);
        box-shadow:
          0 0 0 5px rgba(74, 104, 134, 0.12),
          inset 0 2px 1px #fff,
          0 12px 28px rgba(74, 104, 134, 0.2);
      }

      .tag {
        background:
          radial-gradient(80px 20px at 30% 0, #fff, transparent),
          rgba(200, 200, 255, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.95);
        box-shadow:
          inset 0 1px 1px #fff,
          0 4px 10px rgba(74, 104, 134, 0.12);
      }

      .pin {
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.5) 0, rgba(255, 255, 255, 0.08) 48%, transparent 50%),
          linear-gradient(180deg, rgba(140, 140, 255, 0.92), rgba(70, 70, 230, 0.95));
        border: 1.5px solid rgba(255, 255, 255, 0.75);
        box-shadow:
          inset 0 2px 1px rgba(255, 255, 255, 0.7),
          0 0 0 8px rgba(74, 104, 134, 0.12),
          0 14px 30px rgba(74, 104, 134, 0.45);
      }

      .pin.d {
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.3) 0, transparent 50%),
          linear-gradient(180deg, #3c3f55, #14151f);
      }

      .map {
        background: linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.6),
          rgba(215, 218, 238, 0.4)
        );
        box-shadow:
          0 24px 60px rgba(37, 55, 69, 0.1),
          inset 0 1px 0 #fff;
      }

      .ov {
        background: rgba(40, 40, 80, 0.16);
      }

      /* ============================================================
         v4 — FROSTED MATTE GLASS, WARM NEUTRAL
         ============================================================ */
      :root {

      /* ==========================================================

      const stat = (i, t, v) => `

      const hub = (n, d, a, p, c) => `
        <div class="g row sb" style="padding:22px 26px;border-radius:24px">
          ${ic("pin")}

          <div class="wrap" style="--w:${1440 * s}px;--h:${900 * s}px">
            <div class="fr" style="--s:${s}">
              <div class="deco">
                <i class="sp" style="right:${60 + (k % 4) * 110}px;top:${70 + (k % 3) * 40}px"></i>
                <i class="tl" style="left:${30 + (k % 3) * 170}px;bottom:${30 + (k % 2) * 50}px"></i>
                <i class="pl" style="right:${380 + (k % 3) * 90}px;bottom:${20 + (k % 4) * 20}px"></i>
              </div>
              ${f[1]}
            </div>
          </div>`
        ).join("");
      }
